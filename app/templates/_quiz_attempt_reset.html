<form method="post" action="{{ url_for('learning.reset_live_quiz_attempt') }}" class="quiz-attempt-reset-form" onsubmit="return window.confirm('Обнулить ответы и результат этого теста?');">
    <input type="hidden" name="_csrf_token" value="{{ csrf_token }}">
    <input type="hidden" name="course" value="{{ reset_course }}">
    <input type="hidden" name="item_number" value="{{ reset_item_number }}">
    <button type="submit" class="btn btn-danger">Обнулить результат</button>
</form>
