{% extends "base.html" %}

{% block title %}Развитие | Шанс{% endblock %}

{% block content %}
<section class="learning-page section-styled-page">
    <div class="page-header">
        <h1>Развитие</h1>
    </div>

    <div class="dashboard-grid study-direction-grid">
        <a href="{{ url_for('learning.english_course') }}" class="dashboard-card dashboard-card-featured study-card-english">
            <div class="dashboard-card-icon study-card-icon-english" aria-hidden="true">EN</div>
            <span class="study-card-badge study-card-badge-active">30 дней</span>
            <div class="dashboard-card-title">English</div>
            <div class="dashboard-card-text">Слова, предложения, разговорная практика и тесты с озвучкой.</div>
            <span class="dashboard-card-arrow" aria-hidden="true">→</span>
        </a>
        <a href="{{ url_for('learning.english_it_hub') }}" class="dashboard-card dashboard-card-featured study-card-english">
            <div class="dashboard-card-icon study-card-icon-it" aria-hidden="true">IT</div>
            <span class="study-card-badge study-card-badge-active">3 блока</span>
            <div class="dashboard-card-title">IT</div>
            <div class="dashboard-card-text">Разработчик Python, основные понятия и видеокурс «Python с нуля».</div>
            <span class="dashboard-card-arrow" aria-hidden="true">→</span>
        </a>
    </div>
</section>
{% endblock %}
